<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Places – Gentle Progress</title>
    <link rel="icon" type="image/png" href="images/logoalex.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        background: #ffffff;
        color: #1a1a1a;
      }

      nav {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #e5e7eb;
        z-index: 1000;
      }

      .navcontainer {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logoname {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        text-decoration: none;
      }

      .navmenu {
        display: flex;
        gap: 40px;
      }

      .navlinks {
        display: flex;
        gap: 40px;
        list-style: none;
        align-items: center;
      }

      .navlinks a {
        color: #1a1a1a;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
      }

      .navlinks a:hover {
        color: rgba(10, 25, 41, 0.6);
      }

      .contactbtn {
        background: rgba(10, 25, 41, 1);
        color: #ffffff;
        padding: 10px 24px;
        border-radius: 25px;
        text-decoration: none;
        font-size: 14px;
      }

      .pagewrapper {
        margin-top: 80px;
        padding: 30px 48px 80px;
        max-width: 1400px;
        margin-left: auto;
        margin-right: auto;
      }

      .pageheader {
        margin-bottom: 40px;
        text-align: center;
      }

      .pageheader h3 {
        color: #6b7280;
        font-size: 28px;
        font-weight: 500;
      }

      .mapwrapper {
        width: 100%;
        border: 3px solid #0a1929;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(10, 25, 41, 0.15);
      }

      .mapwrapper img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 768px) {
        .navcontainer {
          padding: 16px 24px;
        }
        .navlinks {
          gap: 16px;
        }
        .pagewrapper {
          padding: 40px 24px 60px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="navcontainer">
        <a href="index.html" class="logoname">Gentle Progress</a>
        <div class="navmenu">
          <ul class="navlinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#post-1">Blogs</a></li>
            <li><a href="index.html#expertise">Expertise</a></li>
            <li><a href="photodump.html">Photo Gallery</a></li>
            <li><a href="mediasection.html">Media Section</a></li>
            <li><a href="imagemap.html">Dream Places</a></li>
            <li><a href="bucketlist.html">Bucket List</a></li>
          </ul>
          <a href="index.html#contact" class="contactbtn">Reach</a>
        </div>
      </div>
    </nav>

    <div class="pagewrapper">
      <div class="pageheader">
        <h3>Please choose a destination.</h3>
      </div>

      <div class="mapwrapper" style="position: relative">
        <img
          src="images/imgmapping.png"
          alt="Dream map showing Bali, Malta, Santorini, Cyprus, and Madagascar"
          style="width: 100%; height: auto; display: block"
        />
        <svg
          viewBox="0 0 1700 1100"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%"
        >
          <a href="cyprus.html" title="Cyprus">
            <polygon
              points="369,786 171,890 264,1022 564,920 662,735 497,808 412,826 384,811 372,796"
              fill="transparent"
            />
          </a>
          <a href="malta.html" title="Malta">
            <polygon
              points="73,320 204,412 244,570 390,631 473,544 384,454 149,268 110,283 82,290 79,305"
              fill="transparent"
            />
          </a>
          <a href="santorini.html" title="Santorini">
            <polygon
              points="1425,232 1638,484 1644,647 1537,784 1268,673 1471,520 1415,352 1303,316 1299,261 1334,253 1366,239 1348,245 1352,238"
              fill="transparent"
            />
          </a>
          <a href="madagascar.html" title="Madagascar">
            <polygon
              points="1047,563 889,716 862,986 925,1059 990,1013 1068,770 1122,647"
              fill="transparent"
            />
          </a>
          <a href="bali.html" title="Bali">
            <polygon
              points="860,43 680,77 559,49 613,193 724,197 844,283 868,335 905,358 938,277 1060,243 1108,185 1012,92 950,57"
              fill="transparent"
            />
          </a>
        </svg>
      </div>
    </div>
  </body>
</html>
