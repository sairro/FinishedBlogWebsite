    <style>
      * {

        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        background: #ffffff;
        color: #1a1a1a;
      }

      nav {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #e5e7eb;
        z-index: 1000;
      }

      .navcontainer {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logoname {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        text-decoration: none;
      }

      .navmenu {
        display: flex;
        gap: 40px;
      }

      .navlinks {
        display: flex;
        gap: 40px;
        list-style: none;
        align-items: center;
      }

      .navlinks a {
        color: #1a1a1a;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
      }

      .navlinks a:hover {
        color: rgba(10, 25, 41, 0.6);
      }

      .contactbtn {
        background: rgba(10, 25, 41, 1);
        color: #ffffff;
        padding: 10px 24px;
        border-radius: 25px;
        text-decoration: none;
        font-size: 14px;
      }

      .pagewrapper {
        margin-top: 80px;
        padding: 30px 48px 80px;
        max-width: 1400px;
        margin-left: auto;
        margin-right: auto;
      }

      .pageheader {
        margin-bottom: 40px;
        text-align: center;
      }

      .pageheader h3 {
        color: #6b7280;
        font-size: 28px;
        font-weight: 500;
      }

      .mapwrapper {
        width: 100%;
        border: 3px solid #0a1929;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(10, 25, 41, 0.15);
      }

      .mapwrapper img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 768px) {
        .navcontainer {
          padding: 16px 24px;
        }
        .navlinks {
          gap: 16px;
        }
        .pagewrapper {
          padding: 40px 24px 60px;
        }
      }
    </style>
